<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Light</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Full-screen flash -->
    <div id="flash-overlay"></div>

    <!-- Sliding alert banner -->
    <div id="alert-banner">
        <span class="banner-icon" id="banner-icon">🚨</span>
        <span id="banner-text">EMERGENCY SIREN DETECTED</span>
    </div>
    
    <div class="main-panel">

        <div class="status-badge off" id="status-badge">
            <span class="pulse-dot"></span>
            <span id="status-text">Stopped</span>

        </div>

        <div class="detection-display">
            <div class="icon-ring" id="icon-ring">
                <span class="icon-inner" id="icon-inner">👂</span>
            </div>
            <div class="detection-label" id="detection-label">Awaiting Sound…</div>

            <button id="toggle-btn" class="toggle-btn">Start</button>

        </div>
    </div>
</body>
<script src="app.js"></script>
</html>
